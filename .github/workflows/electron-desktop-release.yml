name: Electron Windows release candidate

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Never-published qa-* draft containing the private git archive
        required: true
        type: string
      source_asset:
        description: Exact ZIP asset name, without directories or wildcards
        required: true
        type: string
      source_sha256:
        description: Expected SHA-256 of the private git archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: electron-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      FOCOACH_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out only the public CI harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore the exact private source from its draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOCOACH_SOURCE_TAG: ${{ inputs.source_tag }}
          FOCOACH_SOURCE_ASSET: ${{ inputs.source_asset }}
          FOCOACH_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: ./scripts/electron-desktop-release-ci.ps1 -Phase Restore

      - name: Test and package the Windows x64 release
        run: ./scripts/electron-desktop-release-ci.ps1 -Phase Build

      - name: Collect distributables and sanitized verification
        if: always()
        run: ./scripts/electron-desktop-release-ci.ps1 -Phase Collect

      - name: Upload only the candidate and sanitized verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-win-x64-release
          path: ${{ runner.temp }}/focoach-electron-artifact-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7

      - name: Remove the private source and detailed logs
        if: always()
        run: ./scripts/electron-desktop-release-ci.ps1 -Phase Cleanup

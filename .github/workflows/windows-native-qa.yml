name: Windows profile menu native QA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      QA_TAG: qa-profile-menu-20261019-f0a2c3b
    steps:
      - name: Reconstruct reviewed unpublished application over the published portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:QA_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'QA source and evidence must remain unpublished.' }
          New-Item -ItemType Directory -Force inputs, app, evidence, evidence/screenshots | Out-Null
          gh release download v0.4.10 --repo $env:GITHUB_REPOSITORY --pattern Focoach.Desktop-win-x64-Portable.zip --dir inputs
          if ($LASTEXITCODE -ne 0) { throw 'Published portable runtime download failed.' }
          if ((Get-FileHash inputs/Focoach.Desktop-win-x64-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '805f557dcfad3c41503feb38fa4e9aa4f01c8a83ec51a52b78ce9947be780be8') { throw 'Published runtime digest mismatch.' }
          gh release download $env:QA_TAG --repo $env:GITHUB_REPOSITORY --pattern profile-menu-patch.zip --dir inputs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed private patch download failed.' }
          if ((Get-FileHash inputs/profile-menu-patch.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b2e617cfde93314db41324cfc79e7913ddccacdf796ac59730cdcfa46129e845') { throw 'Reviewed patch digest mismatch.' }
          Expand-Archive inputs/Focoach.Desktop-win-x64-Portable.zip app
          Expand-Archive inputs/profile-menu-patch.zip app -Force
          $manifest = Get-Content app/profile-menu-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.sourceInputsSha256 -ne 'b98f1e81f21581d894b00ec4d349a5c141119b35e6ce4aa68bc0de53883bda0e' -or $manifest.baselineCommit -ne 'f0a2c3b5175c5849cb878897dd0b2d4550993bc2' -or !$manifest.sourceTreeDirty -or $null -ne $manifest.sourceCommit) { throw 'Source provenance mismatch.' }
          $current = [IO.Path]::GetFullPath('app/current')
          foreach ($item in $manifest.payloadFiles) {
            $file = [IO.Path]::GetFullPath((Join-Path $current $item.path))
            if (!$file.StartsWith($current + [IO.Path]::DirectorySeparatorChar) -or !(Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item $file).Length -ne $item.sizeBytes -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.sha256) { throw 'Reconstructed application payload mismatch.' }
          }
          if ((Get-FileHash app/current/focoach.dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b766a72eb3844c89ad5f1bfba5ca2dce4fbb29b44286d76813064469784c4861') { throw 'Final assembly digest mismatch.' }
          [ordered]@{ baselinePortableSha256='805f557dcfad3c41503feb38fa4e9aa4f01c8a83ec51a52b78ce9947be780be8'; patchSha256='b2e617cfde93314db41324cfc79e7913ddccacdf796ac59730cdcfa46129e845'; assemblySha256='b766a72eb3844c89ad5f1bfba5ca2dce4fbb29b44286d76813064469784c4861'; sourceInputsSha256='b98f1e81f21581d894b00ec4d349a5c141119b35e6ce4aa68bc0de53883bda0e'; sourceCommit=$null; sourceTreeDirty=$true; baselineCommit='f0a2c3b5175c5849cb878897dd0b2d4550993bc2'; reviewedPayloadFiles=$manifest.payloadFiles.Count } | ConvertTo-Json | Set-Content evidence/input.json
      - name: Execute real profile-menu and account UI with isolated synthetic profiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FOCOACH_REVIEW_DIRECTORY = (Resolve-Path evidence/screenshots).Path
          $env:FOCOACH_TEST_ACCOUNT_UI = '1'
          $app = (Resolve-Path app/current/focoach.exe).Path
          function Invoke-NativeSmoke([string]$Kind) {
            $profile = Join-Path $env:RUNNER_TEMP ('focoach-profile-menu-' + $Kind + '-' + [Guid]::NewGuid().ToString('N'))
            $info = [Diagnostics.ProcessStartInfo]::new($app)
            $info.UseShellExecute = $false
            $info.WorkingDirectory = Split-Path $app
            $info.ArgumentList.Add('--data-directory'); $info.ArgumentList.Add($profile); $info.ArgumentList.Add('--smoke-test')
            if ($Kind -eq 'account') { $info.ArgumentList.Add('--account-smoke-test') }
            $process = [Diagnostics.Process]::Start($info)
            try {
              if (!$process.WaitForExit(180000)) { $process.Kill($true); throw "$Kind native smoke timed out." }
              $code = $process.ExitCode
              $name = if ($Kind -eq 'account') { 'account-smoke.txt' } else { 'windows-smoke.txt' }
              $resultPath = Join-Path $profile $name
              if ($code -ne 0 -or !(Test-Path $resultPath) -or !(Get-Content $resultPath -Raw).StartsWith('PASS:')) { throw "$Kind native smoke failed ($code)." }
            } finally {
              if (Test-Path $profile) {
                Get-ChildItem $profile -Recurse -Filter '*smoke.txt' | ForEach-Object {
                  Copy-Item $_.FullName (Join-Path 'evidence' ($Kind + '-' + $_.Name))
                  Write-Host ($_.Name + ': ' + (Get-Content $_.FullName -Raw))
                }
              }
              $process.Dispose()
            }
          }
          Invoke-NativeSmoke 'wpf'
          Invoke-NativeSmoke 'account'
          foreach ($name in @('profile-menu-ko.png','profile-menu-en.png','profile-menu-long-name.png')) {
            if (!(Test-Path -LiteralPath (Join-Path evidence/screenshots $name))) { throw 'Profile menu native screenshot missing.' }
          }
          [ordered]@{ status='PASS'; screenshotCount=@(Get-ChildItem evidence/screenshots -Filter '*.png').Count; assemblySha256='b766a72eb3844c89ad5f1bfba5ca2dce4fbb29b44286d76813064469784c4861' } | ConvertTo-Json | Set-Content evidence/result.json
      - name: Keep UI evidence only in the unpublished QA draft
        if: always()
        shell: pwsh
        run: |
          $release = gh release view $env:QA_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Evidence destination must remain unpublished.' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          [ordered]@{ runId=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; sourceInputsSha256='b98f1e81f21581d894b00ec4d349a5c141119b35e6ce4aa68bc0de53883bda0e' } | ConvertTo-Json | Set-Content evidence/run.json
          $archive = "native-profile-menu-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          Compress-Archive -Path evidence -DestinationPath $archive -CompressionLevel Optimal
          gh release upload $env:QA_TAG $archive --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not retain private native evidence.' }

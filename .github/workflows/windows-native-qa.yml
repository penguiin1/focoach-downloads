name: Windows design native review
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QA_TAG: qa-design-20261019-727da4
    steps:
      - name: Download the unpublished candidate and verify its digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force inputs, app, evidence, evidence/screenshots | Out-Null
          gh release download $env:QA_TAG --repo $env:GITHUB_REPOSITORY --pattern windows-design-review.zip --dir inputs
          if ($LASTEXITCODE -ne 0) { throw 'Unpublished candidate download failed.' }
          $hash = (Get-FileHash inputs/windows-design-review.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9c4a915a37e6694550d263b83857722cefd56098d900fd1049bd4917ab3c09dc') { throw 'Candidate digest mismatch.' }
          Expand-Archive inputs/windows-design-review.zip app
          gh release download $env:QA_TAG --repo $env:GITHUB_REPOSITORY --pattern windows-design-review-patch.zip --dir inputs
          if ($LASTEXITCODE -ne 0) { throw 'Unpublished patch download failed.' }
          $patchHash = (Get-FileHash inputs/windows-design-review-patch.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'f93f6bd4a2d0be0c8d509b7a0319e42673b84cfb937d8643a96961ca1a9da1d6') { throw 'Patch digest mismatch.' }
          Expand-Archive inputs/windows-design-review-patch.zip app -Force
          if ((Get-FileHash app/focoach.dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6fc76dde0582f3736cdb5014e4cb40eb39d859835b358b50b7607b29a1c00f85') { throw 'Final assembly digest mismatch.' }
          [ordered]@{ packageSHA256=$hash; patchSHA256=$patchHash; sourceCommit='bf90aa4dfd90200120936d44538d06a2c77e910b'; nativeWindows=$true } | ConvertTo-Json | Set-Content evidence/input.json
      - name: Execute the actual WPF application with isolated synthetic profiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FOCOACH_REVIEW_DIRECTORY = (Resolve-Path evidence/screenshots).Path
          $env:FOCOACH_TEST_ACCOUNT_UI = '1'
          $app = (Resolve-Path app/focoach.exe).Path
          function Invoke-NativeSmoke([string]$Kind) {
            $profile = Join-Path $env:RUNNER_TEMP ('focoach-design-' + $Kind + '-' + [Guid]::NewGuid().ToString('N'))
            $info = [Diagnostics.ProcessStartInfo]::new($app)
            $info.UseShellExecute = $false
            $info.WorkingDirectory = Split-Path $app
            $info.ArgumentList.Add('--data-directory'); $info.ArgumentList.Add($profile); $info.ArgumentList.Add('--smoke-test')
            if ($Kind -eq 'account') { $info.ArgumentList.Add('--account-smoke-test') }
            $process = [Diagnostics.Process]::Start($info)
            try {
              if (!$process.WaitForExit(180000)) { $process.Kill($true); throw "$Kind native smoke timed out." }
              $code = $process.ExitCode
              $resultName = if ($Kind -eq 'account') { 'account-smoke.txt' } else { 'windows-smoke.txt' }
              $resultPath = Join-Path $profile $resultName
              if ($code -ne 0 -or !(Test-Path $resultPath) -or !(Get-Content $resultPath -Raw).StartsWith('PASS:')) { throw "$Kind native smoke failed ($code)." }
            } finally {
              if (Test-Path $profile) {
                Get-ChildItem $profile -Recurse -Filter '*smoke.txt' | ForEach-Object {
                  Copy-Item $_.FullName (Join-Path 'evidence' ($Kind + '-' + $_.Name))
                  Write-Host ($_.Name + ': ' + (Get-Content $_.FullName -Raw))
                }
              }
              $process.Dispose()
            }
          }
          Invoke-NativeSmoke 'wpf'
          Invoke-NativeSmoke 'account'
          [ordered]@{ status='PASS'; screenshotCount=@(Get-ChildItem evidence/screenshots -Filter '*.png').Count;
            assemblySHA256=(Get-FileHash app/focoach.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content evidence/result.json
      - name: Keep evidence in the same unpublished draft
        if: always()
        shell: pwsh
        run: |
          if (Test-Path evidence) {
            Compress-Archive -Path evidence/* -DestinationPath windows-design-evidence.zip -Force
            gh release upload $env:QA_TAG windows-design-evidence.zip --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not retain native review evidence.' }
          }

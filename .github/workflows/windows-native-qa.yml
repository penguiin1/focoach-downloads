name: Windows installer native QA
on:
  workflow_dispatch:
  push:
    branches: [codex/velopack-native-qa]
    paths: [.github/workflows/windows-native-qa.yml]
permissions:
  contents: write
concurrency:
  group: windows-native-qa
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QA_TAG: qa-velopack-20261019
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native Windows and CurrentUser DPAPI
        shell: pwsh
        run: |
          if (!$IsWindows) { throw 'Native Windows is required.' }
          $plain = [Text.Encoding]::UTF8.GetBytes('isolated-native-Windows-probe')
          $encrypted = [Security.Cryptography.ProtectedData]::Protect($plain, $null, 'CurrentUser')
          $restored = [Security.Cryptography.ProtectedData]::Unprotect($encrypted, $null, 'CurrentUser')
          if ([Convert]::ToBase64String($plain) -ne [Convert]::ToBase64String($restored)) { throw 'DPAPI roundtrip failed.' }
          Write-Host "Native Windows: $([Environment]::OSVersion); interactive: $([Environment]::UserInteractive); DPAPI: passed"
      - name: Download private draft QA inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force inputs, evidence | Out-Null
          gh release download $env:QA_TAG --repo $env:GITHUB_REPOSITORY --pattern Focoach.Desktop-win-x64-Setup.exe --pattern 'Focoach.Desktop-0.4.9-win-x64-*.nupkg' --pattern qa-next-releases.win-x64.json --pattern Test-VelopackInstaller.ps1 --dir inputs
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft inputs.' }
          foreach ($required in @('Focoach.Desktop-win-x64-Setup.exe', 'Focoach.Desktop-0.4.9-win-x64-full.nupkg', 'qa-next-releases.win-x64.json', 'Test-VelopackInstaller.ps1')) {
            if (!(Test-Path (Join-Path inputs $required))) { throw "Missing draft QA input: $required" }
          }
          Move-Item inputs/qa-next-releases.win-x64.json inputs/releases.win-x64.json
          Get-ChildItem inputs -File | Get-FileHash -Algorithm SHA256 | Select-Object @{n='file';e={Split-Path $_.Path -Leaf}}, Hash | ConvertTo-Json | Set-Content evidence/input-hashes.json
      - name: Install, reinstall, update, preserve profile and uninstall
        shell: pwsh
        run: |
          ./inputs/Test-VelopackInstaller.ps1 -InstallerPath inputs/Focoach.Desktop-win-x64-Setup.exe -ExpectedVersion 0.4.8 -UpdatePackagePath inputs/Focoach.Desktop-0.4.9-win-x64-full.nupkg -UpdatedVersion 0.4.9 -ArtifactsDirectory evidence -RequireProductionConfiguration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-qa
          retention-days: 7
          path: evidence/
